<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#0b1120"/>

  <text x="40" y="50" font-size="26" font-weight="700" fill="#f8fafc">AI Query Generator — Flow</text>
  <text x="40" y="76" font-size="14" fill="#94a3b8">ai_query_generator.py / .ps1 · MITRE mapping is grounded, not free-generated</text>

  <!-- Stage 1: NL prompt -->
  <rect x="40" y="140" width="190" height="130" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="135" y="175" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Detection Idea</text>
  <text x="135" y="205" font-size="12" fill="#94a3b8" text-anchor="middle">plain English, e.g.</text>
  <text x="135" y="222" font-size="11" fill="#cbd5e1" text-anchor="middle">"new scheduled task</text>
  <text x="135" y="238" font-size="11" fill="#cbd5e1" text-anchor="middle">created remotely"</text>

  <line x1="230" y1="205" x2="272" y2="205" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Grounding context -->
  <rect x="278" y="115" width="220" height="180" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="388" y="145" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Grounding Context</text>
  <text x="298" y="172" font-size="12" fill="#cbd5e1">• examples.json</text>
  <text x="313" y="189" font-size="11" fill="#94a3b8">real queries for style/fields</text>
  <text x="298" y="215" font-size="12" fill="#cbd5e1">• mitre_reference.json</text>
  <text x="313" y="232" font-size="11" fill="#94a3b8">closed list of valid</text>
  <text x="313" y="247" font-size="11" fill="#94a3b8">technique IDs</text>
  <text x="313" y="268" font-size="11" fill="#94a3b8">(platform: logscale/splunk/graylog)</text>

  <line x1="498" y1="205" x2="540" y2="205" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Gemini -->
  <rect x="546" y="140" width="180" height="130" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="636" y="175" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Gemini API</text>
  <text x="636" y="205" font-size="12" fill="#94a3b8" text-anchor="middle">gemini-3.5-flash</text>
  <text x="636" y="222" font-size="12" fill="#94a3b8" text-anchor="middle">low temperature,</text>
  <text x="636" y="239" font-size="12" fill="#94a3b8" text-anchor="middle">JSON-only response</text>

  <line x1="726" y1="205" x2="768" y2="205" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Validation -->
  <rect x="774" y="115" width="200" height="180" rx="10" fill="#0f2027" stroke="#5eead4" stroke-width="1.5"/>
  <text x="874" y="145" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Validation</text>
  <text x="794" y="172" font-size="12" fill="#cbd5e1">mitre_technique checked</text>
  <text x="794" y="189" font-size="12" fill="#cbd5e1">against reference list</text>
  <text x="794" y="215" font-size="11" fill="#5eead4">✓ in list → kept</text>
  <text x="794" y="233" font-size="11" fill="#fbbf24">✗ not in list → discarded</text>
  <text x="794" y="250" font-size="11" fill="#fbbf24">as hallucination, logged</text>
  <text x="794" y="267" font-size="11" fill="#fbbf24">as a warning</text>

  <line x1="974" y1="205" x2="1016" y2="205" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: Output -->
  <rect x="1022" y="140" width="140" height="130" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="1092" y="170" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Output</text>
  <text x="1042" y="195" font-size="11" fill="#cbd5e1">• query</text>
  <text x="1042" y="212" font-size="11" fill="#cbd5e1">• assumptions</text>
  <text x="1042" y="229" font-size="11" fill="#cbd5e1">• mitre_technique</text>
  <text x="1042" y="246" font-size="11" fill="#cbd5e1">• caveats</text>

  <!-- Bottom banner -->
  <rect x="40" y="370" width="1122" height="50" rx="8" fill="#1c1408" stroke="#92400e" stroke-width="1.5"/>
  <text x="601" y="400" font-size="13" fill="#fbbf24" text-anchor="middle" font-weight="600">
    Generated queries are a draft, not a production-ready detection — validate fields and tune before deploying as an alert
  </text>
</svg>
